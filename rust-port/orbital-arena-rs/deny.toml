[graph]
all-features = true

[bans]
multiple-versions = "warn"
deny = [
    # Article II: anyhow/Box<dyn Error> confined to bin targets/tooling, banned as a
    # sim-crate dependency entirely for this single-crate feature.
    { name = "anyhow" },
]

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "ISC",
]
